<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category Gallery</title>
    <link rel="icon" href="/assets/icons/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="gallery-page">
        <div class="category-header" data-aos="fade-up">
            <h1 class="section-title" id="categoryTitle">Category Gallery</h1>
            <button class="back-button-inline" onclick="window.history.back()">← Back</button>
        </div>

        <div class="short-description" data-aos="fade-up" data-aos-delay="100">
            <p id="categoryDescription">Explore the images for the selected category!</p>
        </div>

        <div class="gallery-container" id="galleryContainer">
            <!-- Images will be dynamically inserted here -->
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('category');

        const titleElement = document.getElementById('categoryTitle');
        const descriptionElement = document.getElementById('categoryDescription');

        if (category) {
            // Format category name for display
            const formattedCategory = category.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            titleElement.textContent = formattedCategory;
            // Set the page title dynamically
            document.title = `${formattedCategory} Gallery - RJ Events`;
            descriptionElement.textContent = `Step into the magic of our "${formattedCategory}" collection — a curated showcase of unforgettable moments and elegant decor.`;

        }

        fetch('gallery.json')
            .then(response => response.json())
            .then(data => {
                const galleryContainer = document.getElementById('galleryContainer');
                let delay = 100;

                if (category in data) {
                    const images = data[category];
                    images.forEach((imagePath, index) => {
                        const galleryItem = document.createElement('div');
                        galleryItem.className = 'gallery-item';
                        galleryItem.setAttribute('data-aos', 'fade-up');
                        galleryItem.setAttribute('data-aos-delay', delay);

                        const img = document.createElement('img');
                        img.src = imagePath;
                        img.alt = `${category} Image ${index + 1}`;
                        img.loading = 'lazy';

                        galleryItem.appendChild(img);
                        galleryContainer.appendChild(galleryItem);
                        delay += 100;
                    });
                } else {
                    galleryContainer.innerHTML = `<p>No images found for this category.</p>`;
                }
            })
            .catch(error => {
                console.error('Error loading category images:', error);
            });

        AOS.init({
            duration: 800
        });
    </script>
</body>

</html>
